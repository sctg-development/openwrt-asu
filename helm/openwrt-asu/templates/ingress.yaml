{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "asu.fullname" . }}
  labels: {{- include "asu.labels" . | nindent 4 }}
  annotations:
    {{- with .Values.ingress.allowList }}
    haproxy.org/allow-list: {{ . | quote }}
    {{- end }}
    {{- with .Values.ingress.annotations }}{{ toYaml . | nindent 4 }}{{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- with .Values.ingress.tls }}
  tls: {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
{{- range (concat (list .Values.ingress.host) .Values.ingress.extraHosts) }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "asu.fullname" $ }}
                port:
                  name: http
{{- end }}
{{- end }}
