{{- if eq .Values.persistence.type "pvc" }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "asu.fullname" . }}-public
  labels: {{- include "asu.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.persistence.pvc.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.pvc.publicSize }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "asu.fullname" . }}-containers
  labels: {{- include "asu.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.persistence.pvc.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.pvc.podmanSize }}
{{- end }}
